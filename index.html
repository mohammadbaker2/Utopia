  --btn-bg:#d8c08a; --btn-fg:#0e2a52; --card:#143562; --card-fg:#f1e9d7; --card-line:#274472; --card-mute:#a9b6cf; --chip-line:rgba(216,192,138,.55); --chip-fg:#d8c08a; --steam:rgba(255,255,255,.7); --ok:#5cc58a; --off:#e08a72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1f3d; --surface:#122c54; --fg:#f1e9d7; --muted:#a9b6cf; --line:#274472;
  --btn-bg:#d8c08a; --btn-fg:#0e2a52; --card:#143562; --card-fg:#f1e9d7; --card-line:#274472; --card-mute:#a9b6cf; --chip-line:rgba(216,192,138,.55); --chip-fg:#d8c08a; --steam:rgba(255,255,255,.7); --ok:#5cc58a; --off:#e08a72; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;margin:0;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand-deep)}
a{color:inherit}
img{display:block;max-width:100%}
button{font-family:inherit}
.wrap{max-width:1160px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--sand);outline-offset:3px}
.btn{position:relative;display:inline-flex;align-items:center;gap:.5rem;padding:.75rem 1.5rem;border-radius:999px;border:1.5px solid var(--btn-bg);background:var(--btn-bg);color:var(--btn-fg);font:600 .95rem var(--body);text-decoration:none;cursor:pointer;transition:transform .25s ease,box-shadow .25s ease}
.btn:hover{box-shadow:0 10px 24px rgba(0,0,0,.28)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.eyebrow{font-family:var(--display);letter-spacing:.22em;text-transform:uppercase;font-size:.8rem}
section{padding-block:84px}
h2{font:400 clamp(2rem,5vw,3.4rem)/1.1 var(--display);margin:.4rem 0 .6rem;text-wrap:balance}
.sub{color:var(--muted);max-width:38rem;margin:0 0 2rem}

/* reveal on scroll */
html.js .rv{opacity:0;transform:perspective(900px) translate3d(0,46px,-60px) rotateX(16deg);transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--d,0)*90ms)}
html.js .rv.in{opacity:1;transform:none}
html.js .rv:not(.in){animation:rvFail .01s 9s forwards}
@keyframes rvFail{to{opacity:1;transform:none}}

/* cursor + progress */
.cdot,.cring{position:fixed;left:0;top:0;z-index:300;pointer-events:none;border-radius:50%;display:none}
@media (hover:hover) and (pointer:fine){html.js .cdot,html.js .cring{display:block}}
.cdot{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--sand)}
.cring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1.5px solid var(--sand);transition:width .25s,height .25s,margin .25s,background .25s,opacity .3s}
.cring.big{width:68px;height:68px;margin:-34px 0 0 -34px;background:rgba(216,192,138,.16)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;color:var(--on-brand);background:rgba(11,31,61,.96);border-bottom:1px solid rgba(216,192,138,.18)}
.top .wrap{display:flex;align-items:center;gap:1rem;min-height:64px;flex-wrap:wrap;padding-block:.5rem}
.top .bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--sand),#fff);transform-origin:0 50%;transform:scaleX(var(--p,0))}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.lg{width:42px;height:42px;perspective:260px}
.lg img{width:42px;height:42px;border-radius:50%;animation:lgspin 7s ease-in-out infinite}
.brand:hover .lg img{animation-duration:1.6s}
@keyframes lgspin{0%,62%{transform:rotateY(0)}82%,100%{transform:rotateY(360deg)}}
.brand b{font:400 1.35rem var(--display);letter-spacing:.14em}
.top nav{display:flex;gap:1.4rem;margin-inline-start:auto;flex-wrap:wrap}
.top nav a{text-decoration:none;font-size:.92rem;color:var(--on-brand-muted);transition:color .2s}
.top nav a:hover{color:var(--on-brand)}
.pill{display:inline-flex;align-items:center;gap:.45rem;font-size:.82rem;padding:.25rem .8rem;border:1px solid rgba(243,236,220,.35);border-radius:999px}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:var(--off)}
.pill.open .dot{background:var(--ok);box-shadow:0 0 0 0 rgba(92,197,138,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(92,197,138,0)}100%{box-shadow:0 0 0 0 rgba(92,197,138,0)}}
.lang{background:transparent;border:1px solid rgba(243,236,220,.35);color:var(--on-brand);border-radius:999px;padding:.25rem .85rem;font:600 .85rem var(--body);cursor:pointer}

/* hero */
.hero{position:relative;overflow:hidden;color:var(--on-brand);padding-block:56px 96px;background:radial-gradient(ellipse 60% 70% at 78% 32%,#1f5199 0,var(--brand) 52%,var(--brand-deep) 100%)}
.beans{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.bgword{position:absolute;left:50%;top:46%;z-index:0;translate:calc(-50% + var(--bx,0px)) calc(-50% + var(--by,0px));font:400 clamp(9rem,34vw,27rem)/1 var(--display);letter-spacing:.04em;color:transparent;-webkit-text-stroke:1.5px rgba(216,192,138,.17);white-space:nowrap;pointer-events:none;user-select:none;direction:ltr}
.hero .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font:400 clamp(3.6rem,12vw,8.2rem)/.95 var(--display);letter-spacing:.06em;margin:.4rem 0 1rem;direction:ltr;text-align:start;perspective:700px}
html[dir="rtl"] .hero h1,#app[dir="rtl"] .hero h1{text-align:right}
.lt{display:inline-block;transform-origin:50% 100%}
.tag{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--sand);font-size:.95rem;margin:0 0 1.2rem}
.hero p.lead{max-width:34rem;color:var(--on-brand-muted);font-size:1.05rem;margin:0 0 1.6rem}
.hero .btn{background:var(--sand);border-color:var(--sand);color:var(--brand-deep)}
.hero .btn.ghost{background:transparent;color:var(--on-brand);border-color:rgba(243,236,220,.55)}
.cta{display:flex;gap:.8rem;flex-wrap:wrap}
.scene{position:relative;perspective:1100px;min-height:480px;display:grid;place-items:center}
.tilt{position:relative;width:100%;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));display:grid;place-items:center}
.orbit{position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);border:1px dashed rgba(216,192,138,.45);border-radius:50%;transform:rotateX(74deg) rotateZ(0);animation:orb 20s linear infinite;pointer-events:none}
.orbit.o2{border-style:solid;border-color:rgba(216,192,138,.2);animation-duration:30s;animation-direction:reverse}
.orbit i{position:absolute;top:-7px;left:50%;margin-left:-7px;width:14px;height:14px;border-radius:50%;background:var(--sand);box-shadow:0 0 18px 3px rgba(216,192,138,.8)}
@keyframes orb{to{transform:rotateX(74deg) rotateZ(360deg)}}
.arches{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;max-width:440px;width:100%;transform-style:preserve-3d}
.arch{padding:6px;border:1.5px solid var(--sand);border-radius:999px 999px 8px 8px;transform:translateZ(var(--z,0px));animation:bob 7s ease-in-out infinite;background:rgba(14,42,82,.35);box-shadow:0 30px 40px -18px rgba(0,0,0,.55)}
.arch:nth-child(2){margin-top:44px;animation-delay:-3.5s}
.arch img{width:100%;aspect-ratio:3/4.2;object-fit:cover;border-radius:999px 999px 3px 3px}
@keyframes bob{50%{translate:0 -14px}}
.sc{position:absolute;left:50%;bottom:20px;z-index:2;width:24px;height:40px;margin-left:-12px;border:1.5px solid rgba(243,236,220,.5);border-radius:14px}
.sc::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:var(--sand);animation:wheel 1.8s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pre .lt{opacity:0;transform:translateY(40%) rotateX(-100deg)}
.play .lt{animation:lt 1.1s cubic-bezier(.2,.9,.25,1) both;animation-delay:calc(var(--i)*.08s + .1s)}
@keyframes lt{from{opacity:0;transform:translateY(40%) rotateX(-100deg)}to{opacity:1;transform:none}}
.pre .hi{opacity:0;transform:translateY(26px)}
.play .hi{animation:up .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d)*.12s + .55s)}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.pre .arch,.pre .orbit{opacity:0}
.play .arch{animation:arIn 1.2s cubic-bezier(.2,.9,.25,1) backwards,bob 7s ease-in-out 1.2s infinite;animation-delay:.5s,1.7s}
.play .arch:nth-child(2){animation-delay:.75s,1.7s}
@keyframes arIn{from{opacity:0;transform:translateZ(var(--z)) translateY(90px) rotateX(35deg)}}

/* marquee */
.marqwrap{overflow:hidden;background:var(--brand-deep);padding:30px 0}
.marq{overflow:hidden;direction:ltr;background:var(--sand);color:var(--brand-deep);padding:14px 0;transform:rotate(-1.6deg) scale(1.03);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.marq.rev{background:transparent;color:var(--sand);transform:rotate(1.2deg) scale(1.03);border-block:1px solid rgba(216,192,138,.35)}
.marq-in{display:flex;width:max-content;animation:mq 32s linear infinite}
.marq.rev .marq-in{animation-direction:reverse;animation-duration:40s}
.marq:hover .marq-in{animation-play-state:paused}
.marq-in span{display:flex;align-items:center;gap:1.8rem;padding-inline-end:1.8rem;font:400 1.7rem var(--display);letter-spacing:.16em;white-space:nowrap}
.marq-in span::after{content:"";width:.7rem;height:.7rem;border-radius:2px;background:currentColor;transform:rotate(45deg);opacity:.7}
@keyframes mq{to{transform:translateX(-50%)}}

/* 3D cup studio */
.studio{position:relative;overflow:hidden;color:var(--on-brand);background:radial-gradient(ellipse 70% 80% at 72% 45%,#1d4f95 0,#0e2a52 55%,#071a38 100%)}
.studio .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:center}
.studio .sub{color:var(--on-brand-muted)}
.fls{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0 1.2rem}
.fl{display:inline-flex;align-items:center;gap:.5rem;padding:.45rem .95rem;border-radius:999px;border:1.5px solid rgba(243,236,220,.3);background:rgba(255,255,255,.06);color:inherit;font:600 .9rem var(--body);cursor:pointer;transition:background .25s,color .25s,transform .25s}
.fl:hover{transform:translateY(-2px)}
.fl i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.fl[aria-pressed="true"]{background:var(--sand);color:var(--brand-deep);border-color:var(--sand)}
.sel{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.4rem;font-family:var(--display);font-size:1.3rem;letter-spacing:.06em}
.sel .chip{border-color:rgba(216,192,138,.6);color:var(--sand);font-family:var(--body);letter-spacing:0}
.stage3d{position:relative;height:clamp(440px,60vw,620px);perspective:1500px;perspective-origin:50% 30%;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;--liq:#b78a62;--foam:#f0e0c8;--liq2:#7d5a3c}
.stage3d:active{cursor:grabbing}
.spot{position:absolute;left:50%;top:60%;width:min(560px,100%);height:340px;margin:-170px 0 0 calc(min(560px,100%)/-2);background:radial-gradient(ellipse,rgba(216,192,138,.28),transparent 66%);pointer-events:none}
.cshadow{position:absolute;left:50%;width:300px;height:70px;margin-left:-150px;background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 68%);filter:blur(5px);pointer-events:none;transition:transform 1s}
.stage3d.open .cshadow{transform:scale(1.15)}
.cupscale{position:absolute;left:50%;top:58%;width:0;height:0;transform-style:preserve-3d;transform:scale(var(--s,1))}
.cup3d{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.s{position:absolute;left:0;top:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.s::after{content:"";position:absolute;inset:0;background:#040d1f;opacity:var(--sh,0)}
.s.gl::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,transparent 22%,rgba(255,255,255,.9) 50%,transparent 78%);opacity:var(--sp,0)}
.sl{background-image:var(--tex)}
.d{position:absolute;left:0;top:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.liq{background:radial-gradient(circle at 36% 30%,var(--foam) 0,transparent 34%),radial-gradient(circle,var(--liq) 0,var(--liq) 60%,var(--liq2) 100%);overflow:hidden}
.liq::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(255,255,255,.24),transparent 22%,rgba(0,0,0,.22) 50%,transparent 74%,rgba(255,255,255,.24));animation:swirl 10s linear infinite}
@keyframes swirl{to{transform:rotate(360deg)}}
.lid3d{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,1.25,.45,1)}
.stage3d.open .lid3d{transform:translate3d(150px,-130px,70px) rotateZ(-24deg) rotateX(-10deg)}
.lidtop{background:radial-gradient(circle at 36% 30%,#555b66,#1b1d22 52%,#0b0c0f)}
.lidtop .sip{position:absolute;right:13%;top:42%;width:27%;height:11%;border-radius:50%;background:#050607;box-shadow:inset 0 2px 3px rgba(255,255,255,.12)}
.lidtop b{position:absolute;left:0;right:0;top:56%;text-align:center;font:400 15px var(--display);letter-spacing:.3em;color:#3a3f48;text-indent:.3em}
.steam3d{position:absolute;left:50%;top:30%;width:0;height:0;pointer-events:none;opacity:0;transition:opacity .6s .3s}
.stage3d.open .steam3d{opacity:1}
.steam3d i{position:absolute;left:-16px;width:32px;height:32px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.6),transparent 70%);filter:blur(5px);animation:rise3 3.6s ease-in infinite}
.steam3d i:nth-child(2){animation-delay:1.2s;--dx:-18px;left:-30px}
.steam3d i:nth-child(3){animation-delay:2.4s;--dx:22px;left:-4px}
@keyframes rise3{0%{transform:translate(0,50px) scale(.6);opacity:0}25%{opacity:.85}100%{transform:translate(var(--dx,10px),-130px) scale(2.5);opacity:0}}
.hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;align-items:center;gap:.6rem;font-size:.82rem;color:var(--on-brand-muted);letter-spacing:.08em;white-space:nowrap}
.hint::before,.hint::after{content:"";width:34px;height:1px;background:rgba(216,192,138,.5)}

/* menu */
.menu{background:var(--surface)}
.tools{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin-bottom:1.6rem}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;flex:1 1 420px}
.tab{padding:.4rem 1rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--fg);font:600 .9rem var(--body);cursor:pointer;transition:background .25s,color .25s,transform .25s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.search{flex:0 1 240px;min-width:0;padding:.55rem 1rem;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);font:400 .95rem var(--body)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:16px}
.cathead{grid-column:1/-1;display:flex;align-items:center;gap:1rem;margin:1.2rem 0 .2rem;font:400 1.2rem var(--display);letter-spacing:.2em;text-transform:uppercase}
.cathead:first-child{margin-top:0}
.cathead::after{content:"";flex:1;border-bottom:1px solid var(--line)}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:.3rem;padding:14px 12px 16px;background:var(--card);color:var(--card-fg);border:1px solid var(--card-line);border-radius:18px;cursor:pointer;overflow:hidden;text-align:center;transition:transform .3s ease-out,box-shadow .35s;-webkit-tap-highlight-color:transparent;animation:cardIn .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n,0)*26ms)}
@keyframes cardIn{from{opacity:0;transform:perspective(800px) translateY(36px) rotateX(24deg)}}
.card:is(:hover,:focus-visible,.on){box-shadow:0 16px 30px rgba(8,20,40,.28)}
.stage{position:relative;width:100%;height:228px;display:grid;place-items:end center;perspective:800px}
.disc{position:absolute;left:50%;bottom:6px;width:136px;height:136px;margin-left:-68px;border-radius:50%;background:radial-gradient(circle at 35% 28%,var(--foam),var(--liquid));opacity:.9;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
:is(.card:hover,.card:focus-visible,.card.on,.cupopen) .disc{transform:scale(1.18)}
.cupbox{--ch:172px;position:relative;height:var(--ch);margin-bottom:12px;transform-style:preserve-3d;transform:translateY(var(--ty,0px)) scale(var(--sc,1)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .3s ease-out;filter:drop-shadow(0 10px 7px rgba(8,20,40,.38))}
.cupbox.navy{aspect-ratio:282/460}
.cupbox.cream{aspect-ratio:324/460}
:is(.card:hover,.card:focus-visible,.card.on,.cupopen) .cupbox{--ty:-6px;--sc:1.08}

.body{z-index:1}
.inside{z-index:2;opacity:0;overflow:visible;transition:opacity .2s ease .12s}
.lid{z-index:3;transform-origin:80% 38%;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.stk{z-index:4;overflow:visible;pointer-events:none}
.straw{transition:transform .8s cubic-bezier(.3,1.4,.5,1)}
:is(.card:hover,.card:focus-visible,.card.on,.cupopen) .inside{opacity:1}
:is(.card:hover,.card:focus-visible,.card.on,.cupopen) .lid{transform:translate(18%,-24%) rotate(-20deg)}
:is(.card:hover,.card:focus-visible,.card.on,.cupopen) .straw{transform:translateY(var(--dy,0px))}
.cupbox>.steam{position:absolute;inset:auto;z-index:5;left:50%;top:calc(var(--ch)*.2 - 36px);width:66px;height:auto;margin-left:-33px;overflow:visible}
.steam path{fill:none;stroke:var(--steam);stroke-width:3;stroke-linecap:round;opacity:0}
:is(.card:hover,.card:focus-visible,.card.on,.cupopen) .steam path{animation:steam 2.2s ease-in-out .35s infinite}
.steam path:nth-child(2){animation-delay:.85s!important}.steam path:nth-child(3){animation-delay:1.35s!important}
@keyframes steam{0%{transform:translateY(10px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.card h4{position:relative;margin:.2rem 0 0;font:400 1.05rem/1.25 var(--display);letter-spacing:.05em}
.card small{position:relative;display:block;min-height:1.1em;color:var(--card-mute);font-size:.78rem;line-height:1.3}
.chips{position:relative;display:flex;gap:.4rem;justify-content:center;flex-wrap:wrap;margin-top:.2rem}
.chip{padding:.1rem .65rem;border:1px solid var(--chip-line);border-radius:999px;color:var(--chip-fg);font-size:.85rem;font-variant-numeric:tabular-nums}
.note{grid-column:1/-1;color:var(--muted);font-size:.88rem;margin:.2rem 0 0}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:1.5rem 0}
.foot-note{display:flex;gap:.4rem 2rem;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:.88rem;margin-top:1rem}

/* inside: flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:24px;margin-top:2.2rem;perspective:1300px}
.flip{position:relative;height:360px;cursor:pointer;animation:bob 7s ease-in-out infinite;animation-delay:calc(var(--k)*-1.6s)}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.2,.8,.2,1)}
.flip:is(:hover,:focus-visible,.on) .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:999px 999px 20px 20px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{background:var(--img) center/cover no-repeat;box-shadow:0 24px 36px -18px rgba(8,20,40,.55);border:1.5px solid var(--sand)}
.face.front::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(8,20,40,.85))}
.face.front h3{position:absolute;z-index:1;left:0;right:0;bottom:22px;margin:0;text-align:center;color:#f3ecdc;font:400 1.35rem var(--display);letter-spacing:.08em;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,var(--brand),var(--brand-deep));color:var(--on-brand);border:1.5px solid var(--sand);padding:3rem 1.4rem 1.4rem;display:flex;flex-direction:column;justify-content:center;gap:.6rem;text-align:center;box-shadow:0 24px 36px -18px rgba(8,20,40,.55)}
.face.back h3{margin:0;font:400 1.4rem var(--display);letter-spacing:.06em;color:var(--sand)}
.face.back p{margin:0;color:var(--on-brand-muted)}

/* day slider */
.daybox{position:relative;border-radius:28px;overflow:hidden;padding:28px;min-height:520px;color:#fff;background:linear-gradient(180deg,var(--sky1,#f7c98b),var(--sky2,#9ec5e6));display:flex;flex-direction:column;justify-content:flex-end;gap:22px;isolation:isolate}
.sunmoon{position:absolute;inset:0;z-index:-1;pointer-events:none}
.sun,.moon{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%}
.sun{background:radial-gradient(circle,#fff6d0 0,#ffd36b 55%,#ffb347 100%);box-shadow:0 0 70px 24px rgba(255,200,90,.6)}
.moon{background:radial-gradient(circle at 36% 34%,#fff,#dfe6f5 60%,#b7c4e3);box-shadow:0 0 50px 14px rgba(200,215,255,.35)}
.stars{position:absolute;inset:0;opacity:var(--st,0)}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.hill{position:absolute;left:-10%;right:-10%;bottom:-70px;height:220px;border-radius:50% 50% 0 0;background:rgba(8,26,56,.72)}
.hill.h2{bottom:-110px;left:-30%;right:20%;background:rgba(8,26,56,.9)}
.daycard{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center;background:rgba(7,20,45,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);border-radius:22px;padding:22px}
.daycard .tm{font:400 clamp(2.2rem,6vw,3.6rem)/1 var(--display);letter-spacing:.06em;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.daycard h3{margin:.5rem 0 .2rem;font:400 1.5rem var(--display);letter-spacing:.06em;color:var(--sand)}
.daycard p{margin:0 0 .9rem;color:#dbe4f5}
.dis{display:flex;flex-wrap:wrap;gap:.5rem}
.di{display:inline-flex;align-items:center;gap:.5rem;padding:.4rem .9rem;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;font:600 .88rem var(--body);cursor:pointer;transition:background .25s,color .25s}
.di i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.di small{opacity:.8;font-weight:400}
.di[aria-pressed="true"]{background:var(--sand);color:var(--brand-deep);border-color:var(--sand)}
.dcup{display:grid;place-items:center;min-height:250px}
.dcup .stage{height:250px}
.dcup .cupbox{--ch:190px}
.trk{width:100%;margin:0;-webkit-appearance:none;appearance:none;height:8px;border-radius:6px;background:linear-gradient(90deg,#f7c98b,#8fc3ee,#f2b676,#d5707a,#1a2f63,#070f26);outline-offset:8px;cursor:pointer;direction:ltr}
.trk::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--sand);border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.trk::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--sand);border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.ticks{display:flex;justify-content:space-between;direction:ltr;font-size:.8rem;letter-spacing:.1em;color:#e7eefc;margin-top:-10px}

/* visit */
.visit{background:radial-gradient(ellipse 60% 80% at 20% 30%,#1f5199 0,var(--brand) 55%,var(--brand-deep));color:var(--on-brand)}
.visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.visit h2{margin-top:0}
.neon{display:inline-block;margin:.4rem 0 1rem;padding:.3rem 1.2rem;border:2px solid var(--glow);border-radius:14px;font:400 clamp(2rem,6vw,3.2rem)/1.2 var(--display);letter-spacing:.2em;color:#fff;text-indent:.2em;--glow:#5cc58a;text-shadow:0 0 6px #fff,0 0 18px var(--glow),0 0 42px var(--glow);box-shadow:0 0 14px var(--glow),inset 0 0 14px var(--glow);animation:flick 4s infinite}
.neon.off{--glow:#e08a72;opacity:.85}

/* ---------- 3D cup ---------- */
function buildCup(cup,N,M,list,kind){
  var cold=kind!=="hot",Rt=118,Rb=90.7,H=258,YO=-129;
  function Y(y){return y+YO}
  function strip(host,yT,rT,yB,rB,n,i,cls,inner,kind){
    var a=Math.PI/n,aT=rT*Math.cos(a),aB=rB*Math.cos(a),L=Math.hypot(yB-yT,aB-aT),phi=Math.atan2(aB-aT,yB-yT)*180/Math.PI;
    var rm=Math.max(rT,rB),W=2*rm*Math.sin(a)*1.05,th=(i+.5)*360/n-180,t=(1-rT/rm)*50,b=(1-rB/rm)*50;
    var d=document.createElement("div");d.className="s "+cls;
    d.style.cssText="width:"+W.toFixed(2)+"px;height:"+L.toFixed(2)+"px;margin-left:"+(-W/2).toFixed(2)+"px;transform-origin:50% 0;transform:translateY("+Y(yT).toFixed(2)+"px) rotateY("+th.toFixed(2)+"deg) translateZ("+aT.toFixed(2)+"px) rotateX("+phi.toFixed(2)+"deg)"+(inner?" rotateY(180deg)":"")+";clip-path:polygon("+t+"% 0,"+(100-t)+"% 0,"+(100-b)+"% 100%,"+b+"% 100%)";
    if(cls.indexOf("sl")>-1){d.style.backgroundSize=(n*100)+"% 100%";d.style.backgroundPosition=(i/(n-1)*100)+"% 0"}
    host.appendChild(d);list.push({el:d,th:th,k:kind,gl:cls.indexOf("gl")>-1});
  }
  function cone(host,yT,rT,yB,rB,n,cls,inner,kind){for(var i=0;i<n;i++)strip(host,yT,rT,yB,rB,n,i,cls,inner,kind)}
  function disc(host,y,r,cls,down,html){
    var d=document.createElement("div");d.className="d "+cls;
    d.style.cssText="width:"+2*r+"px;height:"+2*r+"px;margin:"+(-r)+"px 0 0 "+(-r)+"px;transform:translateY("+Y(y)+"px) rotateX("+(down?-90:90)+"deg)";
    if(html)d.innerHTML=html;host.appendChild(d);return d;
  }
  /* base */
  cone(cup,H,Rb-4,H+40,Rb-20,M,"base",false,"o");
  disc(cup,H+40,Rb-20,"base",true);
  /* sleeve, textured */
  cone(cup,0,Rt,H,Rb,N,cold?"sl gl cr":"sl gl",false,"o");
  /* inner wall */
  cone(cup,0,Rt-6,H,Rb-6,M,"wall",true,"i");
  /* liquid */
  disc(cup,26,Rt-26*(Rt-Rb)/H-7,"liq",false);
  if(kind==="shake"){disc(cup,14,Rt-36,"cream3",false);disc(cup,0,Rt-64,"cream3",false);disc(cup,-12,Rt-92,"cream3",false)}
  /* rim ring */
  disc(cup,0,Rt+.5,"rimring",false);
  /* lid */
  var lid=document.createElement("div");lid.className="lid3d";lid.id="lid3d";cup.appendChild(lid);
  var lc=cold?"lidw":"lidc";
  disc(lid,-10,Rt+7,lc,false);
  disc(lid,0,Rt+7,lc,true);
  cone(lid,-10,Rt+7,0,Rt+7,M,lc,false,"o");
  cone(lid,-36,Rt-30,-10,Rt+1,M,lc,false,"o");
  disc(lid,-36,Rt-30,"lidtop"+(cold?" lidw":""),false,cold?'<span class="sip"></span>':'<span class="sip"></span><b>UTOPIA</b>');
  if(cold){var sw=document.createElement("div");sw.className="straw3";sw.style.cssText="height:210px;transform:translate3d(30px,"+Y(-96)+"px,0) rotateZ(9deg)";lid.appendChild(sw)}
}
function shadeList(L,sp){
  var i,e,psi,df,sh;
  for(i=0;i<L.length;i++){
    e=L[i];psi=(e.th+sp+(e.k==="i"?180:0))*Math.PI/180;
    df=Math.max(0,Math.cos(psi+0.6));
    sh=.46*(1-(.3+.7*df));
    e.el.style.setProperty("--sh",sh.toFixed(3));
    if(e.gl)e.el.style.setProperty("--sp",(Math.pow(Math.max(0,Math.cos(psi+0.6-.35)),36)*.22).toFixed(3));
  }
}

var beans=[],bctx=null,bw=0,bh=0;
function initBeans(){
  var c=$("beans");bctx=c.getContext&&c.getContext("2d");if(!bctx)return;
  var r=c.parentNode.getBoundingClientRect();bw=c.width=Math.round(r.width);bh=c.height=Math.round(r.height);
  var n=NARROW?12:26;beans=[];
  for(var i=0;i<n;i++)beans.push({x:Math.random()*bw,y:Math.random()*bh,s:7+Math.random()*13,v:.25+Math.random()*.6,r:Math.random()*6,vr:(Math.random()-.5)*.02,a:.15+Math.random()*.35});

    var b=beans[i];b.y+=b.v;b.r+=b.vr;if(b.y>bh+30){b.y=-30;b.x=Math.random()*bw}
    bctx.save();bctx.translate(b.x,b.y);bctx.rotate(b.r);bctx.globalAlpha=b.a;
    bctx.fillStyle="#d8c08a";bctx.beginPath();bctx.ellipse(0,0,b.s*.62,b.s,0,0,6.2832);bctx.fill();

function tick(){

    M.moved=false;

    if(M.hbVis){
      var hb=$("hbox"),br=hb.getBoundingClientRect(),bx=(M.x-br.left)/br.width-.5,by=(M.y-br.top)/br.height-.5;
      if(Math.abs(bx)<1&&Math.abs(by)<1){hb.style.setProperty("--vy",(bx*12).toFixed(1)+"deg");hb.style.setProperty("--vx",(-by*10).toFixed(1)+"deg")}
      else{hb.style.setProperty("--vy","0deg");hb.style.setProperty("--vx","0deg")}
    }
    var tg=M.tg&&M.tg.closest&&M.tg.closest("a,button,.card,.flip,.tab,.fl,.di,input");
    $("cring").classList.toggle("big",!!tg);
  }
  if(FINE&&(Math.abs(M.x-M.cx)>.2||Math.abs(M.y-M.cy)>.2)){
    M.cx+=(M.x-M.cx)*.2;M.cy+=(M.y-M.cy)*.2;
    $("cdot").style.transform="translate("+M.x+"px,"+M.y+"px)";
    $("cring").style.transform="translate("+M.cx.toFixed(1)+"px,"+M.cy.toFixed(1)+"px)";
  }

    $("prog").style.setProperty("--p",mx>0?(scrollY/mx).toFixed(4):0);
  }

    M.rx+=(M.trx-M.rx)*.06;M.ry+=(M.try_-M.ry)*.06;
    var hy=-Math.min(scrollY,900)*.14;

    if(sig!==M.sig){

      $("tilt").style.setProperty("--ry",(M.rx*11).toFixed(2)+"deg");
      $("tilt").style.setProperty("--rx",(-M.ry*8).toFixed(2)+"deg");

    }
    drawBeans();
  }
}
function observe(){

  }
